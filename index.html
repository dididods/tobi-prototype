function busy(o,ign){const r=[];S.appts.filter(a=>a.o==o&&a.st!="canc"&&a.st!="noshow"&&a.id!=ign).forEach(a=>{const s=t2m(a.time);r.push([s,s+(a.svc?sv(a.svc).d:a.dur||30)])});return r}
function slots(o,dur,ign){if(isOff(o))return[];const b=busy(o,ign),r=[];for(let m=WH0;m+dur<=WH1;m+=30)r.push({t:m2t(m),f:!b.some(x=>m<x[1]&&m+dur>x[0])});return r}
function toast(m){$("#ts").innerHTML=`<div class="toast" role="status">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#ts").innerHTML="",2600)}

function mode(m){S.mode=m;render();scrollTo(0,0)}
function render(){autoDone();$("#app").innerHTML=topbar()+(S.mode=="client"?client():master());
$("#app").insertAdjacentHTML("beforeend",S.mode=="master"?`<nav class="nav"><div>${[["cal","Календар",'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/>'],["cl","Клієнтки",'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0m2-13a4 4 0 0 1 0 8m1 2a6 6 0 0 1 3 5"/>'],"+",["rq","Запити",'<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'],["st","Налаштування",'<path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']].map(x=>x=="+"?`<button class="fab" aria-label="Новий запис" onclick="quick()">＋</button>`:`<button class="${S.tab==x[0]?"on":""}" onclick="S.tab='${x[0]}';render()"><svg viewBox="0 0 24 24">${x[2]}</svg>${x[1]}${x[0]=="rq"&&pend()?`<i class="bdg">${pend()}</i>`:""}</button>`).join("")}</div></nav>`:clientNav())}

${free<3?`<p class="sm mu">Вільних вікон майже немає.</p>`:""}
<button class="btn g" onclick="waitSheet()">Потрібного часу немає — стати в чергу</button>
<button class="btn" ${s.time?"":"disabled"} onclick="S.be={};S.step=3;render()">Далі</button>${s.time?'':'<p class="sm mu" style="text-align:center;margin:6px 0 0">Оберіть дату й час</p>'}`}
if(st==3){const v=sv(s.svc),e=S.be||{};return `<button class="back" aria-label="Назад до дати й часу" onclick="sv2();S.step=2;render()">← Дата й час</button><h1>Як до тебе звертатися?</h1>${bar}

<label class="f">Телефон <span class="rq">*</span></label><input id="ph" class="${e.p?'bad':''}" type="tel" value="${esc(s.phone||(S.prof?S.prof.phone:''))}" placeholder="+380" autocomplete="tel" oninput="clrE(this,'p')">${e.p?`<div class="er">${e.p}</div>`:''}
<label class="f">Коментар (за бажанням)</label><textarea id="cm">${esc(s.comment)}</textarea>
<label class="f" id="pl">Спосіб оплати</label><div class="pay" role="radiogroup" aria-labelledby="pl">${[['cash','Готівка'],['card','Переказ на картку']].map(k=>`<button type="button" role="radio" aria-checked="${s.pay==k[0]}" class="po ${s.pay==k[0]?'on':''}" onclick="sv2();S.sel.pay='${k[0]}';render()"><i class="rd">${s.pay==k[0]?'✓':''}</i>${k[1]}</button>`).join('')}</div>
${S.prof?'':`<label class="row2 sm" style="justify-content:flex-start;gap:10px;margin-top:12px"><input id="rm" type="checkbox" style="width:20px;height:20px" ${s.rm?'checked':''}> Запам’ятати мої дані для наступних записів</label>`}
<div class="row2" style="margin-top:14px"><span class="mu">До сплати</span><b>${v.p} ₴</b></div>
<button class="btn" onclick="book()">Підтвердити запис</button>`}
const a=S.last,v=sv(a.svc);return `<div class="ok">✓</div><h1>Ти записана, ${esc(a.name.split(" ")[0])}!</h1><p class="mu">Нагадаю в Telegram за годину до візиту.</p>
<div class="card"><b>${esc(v.n)}</b><div>${wd(a.o)}, ${fd(a.o)} о ${a.time}</div><div class="sm mu">${v.d} хв · ${v.p} ₴ · ${a.pay=="cash"?"готівка":"переказ на картку"}</div><hr style="border:0;border-top:1px solid var(--ln)"><div class="sm">${esc(a.name)}, ${esc(a.phone)}</div>${a.cm?`<div class="sm mu">«${esc(a.cm)}»</div>`:""}</div>
<button class="btn g" onclick="toast('Додано в календар (демо)')">Додати до мого календаря</button>

function setSvc(id){const ch=S.sel.svc!=id;S.sel.svc=id;if(ch||!okDay(S.sel.day,id)){S.sel.time=null;S.sel.day=firstOk(id)}S.cm.b=mDiff(S.sel.day)}

if(Object.keys(e).length){S.be=e;render();setTimeout(()=>{const x=document.querySelector('.er');if(x)x.scrollIntoView({block:'center',behavior:'smooth'})},50);return}S.be={};
if(!cslots(s.day,sv(s.svc).d).some(x=>x.t==s.time&&x.f)){toast('Цей час уже зайнятий. Оберіть інший');S.step=2;render();return}
if(!S.prof&&$("#rm")&&$("#rm").checked)S.prof={name:s.name.trim(),phone:s.phone,email:""};
const a={id:S.id++,o:s.day,time:s.time,svc:s.svc,name:s.name.trim(),phone:s.phone,st:"new",paid:false,note:"",cm:s.comment,pay:s.pay,cat:Date.now(),client:true};S.appts.push(a);S.last=a;S.step=4;render();scrollTo(0,0)}

const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()},TT=(a,b)=>{const r=[];for(let m=a;m<=b;m+=30)r.push(m2t(m));return r};
function cslots(o,d){return slots(o,d).map(x=>({t:x.t,f:x.f&&!(o==0&&t2m(x.t)<=nowMin())}))}
function dHor(){const d=new Date();d.setHours(0,0,0,0);d.setMonth(d.getMonth()+3);return Math.round((d-D(0))/864e5)}
function mDiff(o){const a=D(0),b=D(o);return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()}
function okDay(o,id){return o!=null&&o>=0&&o<=dHor()&&cslots(o,sv(id).d).some(x=>x.f)}
function firstOk(id){const h=dHor();for(let o=0;o<=h;o++)if(okDay(o,id))return o;return 1}
function dpick(ctx,sel,ok){const m=S.cm[ctx]||0,b=D(0),first=new Date(b.getFullYear(),b.getMonth()+m,1),n=new Date(b.getFullYear(),b.getMonth()+m+1,0).getDate(),f=Math.round((first-D(0))/864e5),pad=(first.getDay()+6)%7,h=dHor();let c='';for(let i=0;i<pad;i++)c+='<span></span>';
for(let i=0;i<n;i++){const o=f+i,en=o>=0&&o<=h&&ok(o);c+=`<button type="button" class="dc ${o==sel?'on':''} ${o==0?'td':''}" ${en?'':'disabled'} aria-label="${i+1} ${MN[first.getMonth()]}${en?'':', недоступно'}" onclick="dsel('${ctx}',${o})">${i+1}</button>`}
return `<div class="dp"><div class="row2"><button type="button" class="back" aria-label="Попередній місяць" ${m<=0?'disabled':''} onclick="dm('${ctx}',-1)">‹</button><b>${MNN[first.getMonth()]} ${first.getFullYear()}</b><button type="button" class="back" aria-label="Наступний місяць" ${m>=3?'disabled':''} onclick="dm('${ctx}',1)">›</button></div><div class="mg">${['пн','вт','ср','чт','пт','сб','нд'].map(x=>`<small>${x}</small>`).join('')}${c}</div></div>`}
function dsel(ctx,o){if(ctx=='b'){S.sel.day=o;S.sel.time=null;render()}else{S.wf.o=o;delete S.we.o;wRender(1)}}
function dm(ctx,k){S.cm[ctx]=Math.max(0,Math.min(3,(S.cm[ctx]||0)+k));if(ctx=='b')render();else wRender(1)}
function clrE(el,k){el.classList.remove('bad');const x=el.nextElementSibling;if(x&&x.classList.contains('er'))x.remove();if(S.be)delete S.be[k]}
function okE(el,k){el.classList.remove('bad');const x=el.nextElementSibling;if(x&&x.classList.contains('er'))x.remove();delete S.we[k]}
const WM=[['any','Будь-який час'],['before','До певного часу'],['after','Після певного часу'],['between','У проміжку часу']];
function wcond(w){return w.mode=='before'?'Не пізніше '+w.t1:w.mode=='after'?'Не раніше '+w.t1:w.mode=='between'?'З '+w.t1+' до '+w.t2:'Будь-який час'}
function wfit(w,a){if(w.o!=a.o)return false;const m=t2m(a.time);return w.mode=='any'||(w.mode=='before'&&m<=t2m(w.t1))||(w.mode=='after'&&m>=t2m(w.t1))||(w.mode=='between'&&m>=t2m(w.t1)&&m<=t2m(w.t2))}
function waitSheet(){if(!S.wf){const s=S.sel;S.wf={svc:s.svc||'',o:s.day,mode:'',t1:'',t2:'',name:s.name||(S.prof?S.prof.name:''),phone:s.phone||(S.prof?S.prof.phone:'')};S.we={};S.cm.w=mDiff(S.wf.o)}wRender()}
function wMode(m){S.wf.mode=m;S.wf.t1='';S.wf.t2='';delete S.we.mode;delete S.we.t1;delete S.we.t2;wRender(1)}
function wRender(k){const sc=k&&$('.sh')?$('.sh').scrollTop:0,f=S.wf,e=S.we,er=x=>e[x]?`<div class="er">${e[x]}</div>`:'',bd=x=>e[x]?'bad':'';
const op=(l,v,ph)=>`<option value="">${ph}</option>`+l.map(t=>`<option value="${t}" ${t==v?'selected':''}>${t}</option>`).join('');
const fld=(lb,id,key,l)=>`<div><label class="f">${lb} <span class="rq">*</span></label><select id="${id}" class="${bd(key)}" onchange="S.wf.${key}=this.value;okE(this,'${key}')">${op(l,f[key],'Оберіть')}</select>${er(key)}</div>`;
const tf=f.mode=='before'?fld('Не пізніше','wt1','t1',TT(WH0+30,WH1)):f.mode=='after'?fld('Не раніше','wt1','t1',TT(WH0,WH1-30)):f.mode=='between'?`<div class="g2">${fld('З','wt1','t1',TT(WH0,WH1-30))}${fld('До','wt2','t2',TT(WH0+30,WH1))}</div>`:f.mode=='any'?'<p class="sm mu" style="margin:8px 2px 0">Підійде будь-який вільний час у цей день.</p>':'';
sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Список очікування</h2><p class="mu sm" style="margin:0">Це заявка на бажані умови, а не бронювання. Майстриня сама запропонує вільне віконце.</p></div><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div>
<p class="sm mu" style="margin:10px 0 0"><span class="rq">*</span> — обов’язкові поля</p>
<label class="f">Послуга <span class="rq">*</span></label><select id="ws" class="${bd('svc')}" onchange="S.wf.svc=this.value;okE(this,'svc')"><option value="">Оберіть послугу</option>${SV.filter(x=>!x.off).map(x=>`<option value="${x.id}" ${x.id==f.svc?'selected':''}>${esc(x.n)}</option>`).join('')}</select>${er('svc')}
<label class="f">Бажана дата <span class="rq">*</span></label>${dpick('w',f.o,o=>!isOff(o))}<p class="sm" style="margin:6px 2px 0">${f.o!=null?'Обрано: <b>'+wd(f.o)+', '+fd(f.o)+'</b>':'Дату ще не обрано'}</p>${er('o')}
<label class="f" id="wml">Бажаний час <span class="rq">*</span></label><div class="pay" role="radiogroup" aria-labelledby="wml">${WM.map(x=>`<button type="button" role="radio" aria-checked="${f.mode==x[0]}" class="po ${f.mode==x[0]?'on':''}" onclick="wMode('${x[0]}')"><i class="rd">${f.mode==x[0]?'✓':''}</i>${x[1]}</button>`).join('')}</div>${er('mode')}${tf}
<div class="g2 np"><div><label class="f">Ім’я <span class="rq">*</span></label><input id="wn" class="${bd('name')}" value="${esc(f.name)}" autocomplete="name" oninput="S.wf.name=this.value;clrW(this,'name')">${er('name')}</div><div><label class="f">Телефон <span class="rq">*</span></label><input id="wp" type="tel" class="${bd('phone')}" value="${esc(f.phone)}" placeholder="+380" oninput="S.wf.phone=this.value;clrW(this,'phone')">${er('phone')}</div></div>
<div class="row2" style="gap:10px;margin-top:16px"><button class="btn g" style="margin:0" onclick="closeS()">Скасувати</button><button class="btn" style="margin:0" onclick="wSend()">Надіслати заявку</button></div>`);
if(k){const h=$('.sh');h.scrollTop=sc;h.style.animation='none'}}
function clrW(el,k){el.classList.remove('bad');const x=el.nextElementSibling;if(x&&x.classList.contains('er'))x.remove();delete S.we[k]}
function wSend(){const f=S.wf,e={};if(!f.svc)e.svc='Оберіть послугу';if(f.o==null||f.o<0)e.o='Оберіть дату';
if(!f.mode)e.mode='Оберіть, коли вам зручно';else if(f.mode=='before'||f.mode=='after'){if(!f.t1)e.t1='Вкажіть час'}else if(f.mode=='between'){if(!f.t1)e.t1='Вкажіть початок';if(!f.t2)e.t2='Вкажіть кінець';if(f.t1&&f.t2&&t2m(f.t1)>=t2m(f.t2))e.t2='Кінець має бути пізніше за початок'}
if(!f.name.trim())e.name='Вкажіть ім’я';if(f.phone.replace(/\D/g,'').length<10)e.phone='Мінімум 10 цифр';
if(Object.keys(e).length){S.we=e;wRender(1);setTimeout(()=>{const x=document.querySelector('.sh .er');if(x)x.scrollIntoView({block:'center',behavior:'smooth'})},60);return}
const dp=S.wait.some(w=>pk(w.phone)==pk(f.phone)&&w.o==f.o&&w.svc==+f.svc&&w.mode==f.mode&&w.t1==(f.mode=='any'?'':f.t1)&&w.t2==(f.mode=='between'?f.t2:''));
if(dp){toast('Така заявка вже є у списку очікування');return}
S.wait.push({id:S.id++,name:f.name.trim(),phone:f.phone.trim(),svc:+f.svc,o:f.o,mode:f.mode,t1:f.mode=='any'?'':f.t1,t2:f.mode=='between'?f.t2:''});S.wf=null;S.we={};closeS();toast('Заявку додано до списку очікування')}

/* ---------- MASTER ---------- */
function master(){return S.tab=="cal"?cal():S.tab=="cl"?clients():S.tab=="rq"?reqs():S.tab=="st"?stg():cal()}
function stg(){const t=S.sset||'sv';return `<h1>Налаштування</h1><div class="seg vw">${[['sv','Послуги'],['rm','Нагадування']].map(v=>`<button class="${t==v[0]?'on':''}" onclick="S.sset='${v[0]}';render()">${v[1]}</button>`).join('')}</div>`+(t=='sv'?svcs():rem())}
/* Що чекає рішення майстрині — ЄДИНЕ правило для лічильника в календарі, бейджа й вкладки «Запити».
   Не залежить від обраного дня. new — записи «Новий» (самозапис клієнток, зокрема з минулим часом)
   і запити на новий запис; move — запити на перенесення. */
function attn(){const r=S.reqs.filter(x=>x.st=='pending'),a=S.appts.filter(x=>x.st=='new'&&x.svc);return{a,rn:r.filter(x=>x.type!='move'),rm:r.filter(x=>x.type=='move')}}
function pend(){const t=attn();return t.a.length+t.rn.length+t.rm.length}
function pl(n,a,b,c){const m=n%10,h=n%100;return h>10&&h<20?c:m==1?a:m>1&&m<5?b:c}
function cr(m){const d=new Date(Date.now()-m*6e4),n=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),y=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return(y<1?'Сьогодні':y==1?'Вчора':d.getDate()+' '+MN[d.getMonth()])+', '+t}
function dl(o,t){return wd(o)+', '+fd(o)+' · '+t}
function rqOk(r){const a=r.type=='move'?S.appts.find(x=>x.id==r.aid):null;if(r.type=='move'&&(!a||!['new','conf'].includes(a.st)))return 'gone';const d=sv(r.svc).d,s=t2m(r.t);if(r.o<0||(r.o==0&&s<=nowMin()))return 'past';if(isOff(r.o)||s<WH0||s+d>WH1)return 'busy';return busy(r.o,a?a.id:-1).some(b=>s<b[1]&&s+d>b[0])?'busy':'ok'}
function rqCard(r){const v=sv(r.svc),mv=r.type=='move',a=mv?S.appts.find(x=>x.id==r.aid):null,c=rqOk(r);
return `<div class="card"><div class="row2"><b>${esc(r.name)}</b><span class="chip new">Очікує підтвердження</span></div><div class="sm mu">${esc(r.phone)}</div>

function reqs(){const t=attn(),d=S.reqs.filter(r=>r.st!='pending'),n=pend(),nn=t.a.length+t.rn.length,nm=t.rm.length,g=S.rqt||(nn||!nm?'new':'move');
const nw=[...t.a.map(a=>({k:a.o*1440+t2m(a.time),h:apReq(a)})),...t.rn.map(r=>({k:r.o*1440+t2m(r.t),h:rqCard(r)}))].sort((x,y)=>x.k-y.k).map(x=>x.h).join(''),mv=t.rm.slice().sort((a,b)=>a.ago-b.ago).map(rqCard).join('');

const MNN=["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];

function shiftDays(n){if(!n)return;S.appts.forEach(a=>a.o-=n);S.reqs.forEach(r=>{r.o-=n;if(r.po!=null)r.po-=n});S.wait.forEach(w=>w.o-=n);S.offs.forEach(x=>{if(x.t=='d'){x.a-=n;x.b-=n}});

S.t0=T0();setInterval(()=>{const t=T0();if(t!==S.t0){const n=Math.round((t-S.t0)/864e5);S.t0=t;shiftDays(n);closeS();render()}},30000);

`;

l.forEach(a=>{h+=ap(a)});
if(!l.length&&!off)h+=`<div class="brk" style="margin-top:12px">Записів немає. Натисніть «+», щоб додати.</div>`;

function ap(a){const v=a.svc?sv(a.svc):null,x=["canc","noshow"].includes(a.st);return `<button class="card ap ${x?"x":""}" onclick="open_(${a.id})"><div class="t">${a.time}<small>${v?v.d+" хв":(a.dur||30)+" хв"}</small></div><div class="b"><div><b>${isNew(a)?'<i class="nd"></i>':''}${a.st=="block"?"Зайнято":esc(a.name)}</b><span class="chip ${a.st}">${ST[a.st]}</span></div><div class="sm mu"><span>${v?esc(v.n):esc(a.name)}</span>${a.paid?'<span style="color:var(--ok)">● оплачено</span>':""}</div>${a.cm?`<div class="sm" style="margin-top:4px">💬 ${esc(a.cm)}</div>`:""}</div></button>`}

/* Єдине місце з правилами статусів.
   Новий → підтвердити / відхилити. Підтверджений → скасувати; завершити й «не прийшла» — з моменту початку.
   Виправлення вручну: завершений ↔ неявка; скасований → відновити (у попередній статус). */
function stOk(a,s){const n=Date.now();if(a.st=='new')return s=='conf'||s=='canc';if(a.st=='conf')return s=='canc'||((s=='done'||s=='noshow')&&n>=st0(a));if(a.st=='done')return s=='noshow';if(a.st=='noshow')return s=='done';if(a.st=='canc')return s=='restore';return false}
/* Автозавершення: підтверджений запис після закінчення свого часу стає завершеним і оплаченим.
   Скасовані, неявки й непідтверджені («Новий») не змінюються. */
function autoDone(){const n=Date.now();let k=0;S.appts.forEach(a=>{if(a.st=='conf'&&a.svc&&n>=en0(a)){a.st='done';a.auto=en0(a);a.paid=true;k++}});return k}
function setSt(id,s){const a=S.appts.find(x=>x.id==id);if(!a||!stOk(a,s)){toast('Ця дія недоступна для поточного статусу');return}
const from=a.st,to=s=='restore'?(a.prev||'conf'):s;
if((from=='canc'||from=='noshow')&&to!='canc'&&to!='noshow'){const m=t2m(a.time),d=sv(a.svc).d;if(busy(a.o,a.id).some(b=>m<b[1]&&m+d>b[0])){toast('Цей час уже зайнятий іншим записом. Створіть новий запис на вільний час');open_(id);return}}
if(to=='canc')a.prev=from;a.st=to;a.seen=true;if(to=='done'){a.paid=true;delete a.auto}if(to=='noshow')a.paid=false;
closeS();render();
if(to=='canc'&&from!='new')offer(a);
else if(to=='noshow'&&from=='conf'&&a.o==0&&Date.now()<en0(a)){const st=Math.max(t2m(a.time),Math.ceil(nowMin()/10)*10),en=t2m(a.time)+sv(a.svc).d;if(en-st>=30)offer({...a,time:m2t(st)},'Неявку позначено');else toast(ST.noshow)}
else toast(s=='restore'?'Запис відновлено':to=='canc'&&from=='new'?'Запис відхилено':ST[to])}
function askSt(id,s){const a=S.appts.find(x=>x.id==id);if(!a||!stOk(a,s)){toast('Ця дія недоступна для поточного статусу');return}const rj=s=='canc'&&a.st=='new',early=s=='noshow'&&a.st=='conf'&&Date.now()<en0(a);
const m=s=='noshow'?(a.st=='done'?['Клієнтка не прийшла?','Візит буде позначено як неявку замість завершеного, позначку оплати буде знято.','Так, не прийшла']:['Клієнтка не прийшла?','Запис буде позначено як неявку. Це не завершений візит.'+(early?' Решта часу до '+hm(en0(a))+' звільниться в календарі.':''),'Так, не прийшла'])
:s=='done'?['Клієнтка все ж була?','Запис стане завершеним візитом і буде позначений як оплачений.','Так, позначити завершеним']
:s=='restore'?['Відновити запис?','Запис повернеться зі статусом «'+ST[a.prev||'conf']+'», час '+a.time+' знову буде зайнятий.','Відновити запис']
:rj?['Відхилити запис?','Запис не буде підтверджено, час звільниться в календарі.','Так, відхилити']:['Скасувати запис?','Клієнтка попередила, що не прийде. Час звільниться в календарі.','Так, скасувати'];
const red=s=='noshow'||s=='canc';
sheet(`<h2 style="margin-top:0">${m[0]}</h2><p class="mu" style="margin:0">${esc(a.name)} · ${dl(a.o,a.time)}</p><p class="sm">${m[1]}</p><button class="btn" ${red?'style="background:var(--bad);box-shadow:none"':''} onclick="setSt(${id},'${s}')">${m[2]}</button><button class="btn g" onclick="open_(${id})">Назад</button>`)}

<button class="card ap ${started?'':'x'}" ${started?'':'disabled'} style="margin:8px 0" onclick="askSt(${id},'noshow')"><div class="b"><b>Клієнтка не прийшла</b><div class="sm mu">${started?'Запис почався, а клієнтки немає':'Доступно з '+hm(st0(a))}</div></div></button>`)}
function del(id){S.appts=S.appts.filter(a=>a.id!=id);closeS();render()}
function moveS(id){const a=S.appts.find(x=>x.id==id);sheet(`<h2>Перенести запис</h2><p class="mu sm" style="margin:0">${esc(a.name)} · ${esc(sv(a.svc).n)}</p><div class="g2 dt"><div><label class="f">Дата</label><select id="mo" onchange="mFill(${id},1)"></select></div><div><label class="f">Година</label><select id="mt"></select></div></div><p class="sm mu" style="margin:6px 2px 0">Сірим позначено вихідні й зайнятий час.</p><button class="btn" onclick="doMove(${id})">Зберегти</button>`);mFill(id,0,a.o,a.time)}
function mFill(id,only,io,it){const a=S.appts.find(x=>x.id==id),d=sv(a.svc).d,ds=$("#mo"),ts=$("#mt");
if(!only){ds.innerHTML=[...Array(dHor()+1)].map((_,o)=>{const sl=slots(o,d,id),off=isOff(o),bad=off||!sl.some(x=>x.f);return `<option value="${o}" ${bad?'disabled style="color:#a9a3b8"':""}>${wd(o)}, ${fd(o)}${off?" · вихідний":bad?" · зайнято":""}</option>`}).join("");ds.value=io;if(!ds.selectedOptions[0]||ds.selectedOptions[0].disabled){const f=[...ds.options].find(x=>!x.disabled);if(f)ds.value=f.value}}
const sl=slots(+ds.value,d,id),cur=only?ts.value:it;ts.innerHTML=sl.map(x=>`<option value="${x.t}" ${x.f?"":'disabled style="color:#a9a3b8"'}>${x.t}${x.f?"":" · зайнято"}</option>`).join("");ts.value=cur;if(!ts.value||!ts.selectedOptions[0]||ts.selectedOptions[0].disabled){const f=sl.find(x=>x.f);if(f)ts.value=f.t}}
function doMove(id){const a=S.appts.find(x=>x.id==id),o=+$("#mo").value,t=$("#mt").value;if(!t){toast("У цей день немає вільного часу");return}const d=sv(a.svc).d,s=t2m(t);
const bad=busy(o,id).some(b=>s<b[1]&&s+d>b[0])||s<WH0||s+d>WH1;if(bad){toast("Цей час недоступний: він зайнятий або поза робочими годинами");return}
a.o=o;a.time=t;a.seen=true;closeS();S.day=o;render();toast("Запис перенесено")}
function offer(a,lb){const c=S.wait.slice().sort((x,y)=>wfit(y,a)-wfit(x,a));if(!c.length){toast((lb||"Скасовано")+". Список очікування порожній");return}
sheet(`<h2>Звільнилось вікно ${a.time}</h2><p class="mu sm">${wd(a.o)}, ${fd(a.o)}. Оберіть, кому запропонувати — повідомлення піде лише вибраним.</p>${c.map(w=>`<label class="card row2" style="cursor:pointer"><span><b>${esc(w.name)}</b>${wfit(w,a)?' <span class="chip conf">Підходить</span>':''}<br><span class="sm mu">${esc(sv(w.svc).n)}</span><br><span class="sm mu">Бажано: ${wd(w.o)}, ${fd(w.o)} · ${wcond(w)}</span></span><input type="checkbox" class="wc" style="width:22px;height:22px" ${wfit(w,a)?"checked":""}></label>`).join("")}
<button class="btn" onclick="sendOffer()">Запропонувати вибраним</button><button class="btn g" onclick="closeS()">Не пропонувати</button>`)}
function sendOffer(){const n=[...document.querySelectorAll(".wc")].filter(x=>x.checked).length;closeS();toast(n?`Пропозицію надіслано: ${n} (демо)`:"Нікого не вибрано")}
function quick(){sheet(`<h2>Новий запис</h2>
<div class="g2 np"><div><label class="f">Ім’я</label><input id="qn" placeholder="Ім’я клієнтки" autofocus></div><div><label class="f">Телефон</label><input id="qp" type="tel" placeholder="+380" autocomplete="off"></div></div>
<label class="f">Послуга (можна пізніше)</label><select id="qs" onchange="qFill()">${SV.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join("")}<option value="0">Заблокувати час (30 хв)</option></select>
<div class="g2 dt"><div><label class="f">Дата</label><select id="qd" onchange="qFill(1)"></select></div><div><label class="f">Година</label><select id="qt"></select></div></div>
<p class="sm mu" style="margin:6px 2px 0">Сірим позначено вихідні й зайнятий час.</p>
<label class="f">Нотатки для себе</label><textarea id="qm" placeholder="Наприклад, дизайн або побажання"></textarea>
<button class="btn" onclick="addQ()">Додати</button>`);qFill(0,S.day)}
function qFill(only,init){const sid=+$("#qs").value,d=sid?sv(sid).d:30,ds=$("#qd");
if(!only){const cur=init!=null?init:+ds.value;ds.innerHTML=[...Array(dHor()+1)].map((_,o)=>{const sl=slots(o,d),off=isOff(o),bad=off||!sl.some(x=>x.f);return `<option value="${o}" ${bad?'disabled style="color:#a9a3b8"':""}>${wd(o)}, ${fd(o)}${off?" · вихідний":bad?" · зайнято":""}</option>`}).join("");ds.value=cur;if(!ds.selectedOptions[0]||ds.selectedOptions[0].disabled){const f=[...ds.options].find(x=>!x.disabled);if(f)ds.value=f.value}}
const sl=slots(+ds.value,d),ts=$("#qt"),cur=ts.value;ts.innerHTML=sl.map(x=>`<option value="${x.t}" ${x.f?"":'disabled style="color:#a9a3b8"'}>${x.t}${x.f?"":" · зайнято"}</option>`).join("");ts.value=cur;if(!ts.value||!ts.selectedOptions[0]||ts.selectedOptions[0].disabled){const f=sl.find(x=>x.f);if(f)ts.value=f.t}}
function addQ(){const n=$("#qn").value.trim(),o=+$("#qd").value,t=$("#qt").value,s=+$("#qs").value;if(s&&!n){toast("Вкажіть ім’я");return}if(!t){toast("У цей день немає вільного часу");return}
const d=s?sv(s).d:30,m=t2m(t);if(busy(o).some(b=>m<b[1]&&m+d>b[0])||m<WH0||m+d>WH1){toast("Цей час недоступний");return}
S.appts.push({id:S.id++,o,time:t,svc:s||null,dur:30,name:s?n:"Блок",phone:s?$("#qp").value.trim():"",st:s?"conf":"block",paid:false,note:s?$("#qm").value.trim():""});closeS();S.day=o;render();toast(s?"Запис додано":"Час заблоковано")}
/* Клієнтки групуються за ключем pk(): «+380 67 111 22 33» і «0671112233» — одна клієнтка. Ім'я й телефон беруться з найсвіжішого запису. */
function cliMap(){const m={};S.appts.filter(a=>a.svc&&pk(a.phone)).sort((a,b)=>a.o-b.o||t2m(a.time)-t2m(b.time)).forEach(a=>{const k=pk(a.phone),c=m[k]=m[k]||{k,v:[]};c.name=a.name;c.phone=a.phone;c.v.push(a)});return m}
function clients(){const all=Object.values(cliMap()),q=S.q.toLowerCase().trim(),qd=q.replace(/\D/g,''),l=all.filter(c=>c.name.toLowerCase().includes(q)||(qd&&(c.phone.replace(/\D/g,'').includes(qd)||c.k.includes(qd))));
return `<h1>Клієнтки</h1><input id="q" placeholder="Пошук за ім’ям або телефоном" value="${esc(S.q)}" oninput="S.q=this.value;const p=this.selectionStart;render();const e=$('#q');e.focus();e.setSelectionRange(p,p)">
${l.map(c=>{const n=c.v.filter(a=>a.st=="done").length;return `<button class="card ap" onclick="cli('${c.k}')"><div class="b"><div><b>${esc(c.name)}</b><span class="sm mu">${n} ${pl(n,'візит','візити','візитів')}</span></div><div class="sm mu">${esc(c.phone)}</div></div></button>`}).join("")||`<div class="brk" style="margin-top:12px">${all.length?'Нікого не знайдено. Спробуйте частину номера.':'Клієнток поки немає. Вони з’являться після першого запису.'}</div>`}`}
function cli(k){const c=cliMap()[k];if(!c)return;const v=c.v.slice().sort((a,b)=>b.o-a.o||t2m(b.time)-t2m(a.time)),nt=v.find(a=>a.note);sheet(`<h2>${esc(c.name)}</h2><p class="mu" style="margin:0">${esc(c.phone)}</p><label class="f">Історія візитів</label>${v.map(a=>`<div class="card row2"><span><b>${esc(sv(a.svc).n)}</b><br><span class="sm mu">${a.o<0?-a.o+" дн. тому":wd(a.o)+", "+fd(a.o)} · ${a.time}</span></span><span class="chip ${a.st}">${ST[a.st]}</span></div>`).join("")}${nt?`<div class="card sm">📝 ${esc(nt.note)}</div>`:""}<button class="btn" onclick="cliNew('${k}')">Створити запис</button>`)}
function cliNew(k){const c=cliMap()[k];closeS();S.tab='cal';render();quick();if(c){$('#qn').value=c.name;$('#qp').value=c.phone}}
function nextAp(){const n=Date.now();return S.appts.filter(a=>a.svc&&["new","conf"].includes(a.st)&&st0(a)>n).sort((a,b)=>a.o-b.o||t2m(a.time)-t2m(b.time))[0]}
function rem(){const a=nextAp();return `<h1>Нагадування</h1><p class="mu sm">Так клієнтка бачить повідомлення в Telegram. Натисніть кнопку — календар оновиться.</p>
${a?`<div class="tg"><div class="sm" style="margin-bottom:6px">Нагадування для: <b>${esc(a.name)}</b></div><div class="m">За годинку вже творимо красу 💅 Чекаю на тебе о ${a.time}! Підтверджуєш, що все в силі?</div><div class="k"><button onclick="reply(${a.id},'conf')">Підтверджую</button><button onclick="reply(${a.id},'canc')">Не зможу прийти</button></div></div>
<p class="sm mu">Зараз: <span class="chip ${a.st}">${ST[a.st]}</span> · ${wd(a.o)}, ${a.time}</p>`:`<div class="brk">Немає майбутніх записів для нагадування.</div>`}
<h2 style="margin-top:18px">Коли нагадувати</h2><div class="card row2"><span>За 1 годину<br><span class="sm mu">за замовчуванням</span></span><button class="tog on" aria-label="За годину" disabled></button></div>
<div class="card row2"><span>За 24 години</span><button class="tog ${S.rem24?"on":""}" aria-label="За 24 години" onclick="S.rem24=!S.rem24;render()"></button></div>
<p class="sm mu">Спершу Telegram. Viber перевіряємо окремо.</p>`}
function reply(id,s){const a=S.appts.find(x=>x.id==id);if(!a)return;if(a.st==s){toast('Статус уже: '+ST[s]);return}if(!stOk(a,s)){toast('Ця дія недоступна для поточного статусу');return}a.st=s;a.seen=true;render();if(s=="canc"){toast(esc(a.name)+" не зможе прийти");offer(a)}else toast(esc(a.name)+" підтвердила візит")}
render();
(function(){const sp=document.getElementById('sp');if(!sp)return;const tb=sp.querySelector('.tb'),c=document.getElementById('spc'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,dp=Math.min(devicePixelRatio||1,2);let W,H,done=false,raf;
function rs(){W=innerWidth;H=innerHeight;c.width=W*dp;c.height=H*dp;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dp,0,0,dp,0,0)}rs();
const CL=['#ffffff','#ff7fae','#a98bf0'],st=[...Array(48)].map((_,i)=>({x:Math.random(),y:.5+(Math.random()-.5)*(Math.random()<.7?.26:.9),r:3+Math.random()*8,p:Math.random()*6.28,s:1.4+Math.random()*2.4,d:Math.random()*2200,c:CL[i%3]}));
function star(px,py,r,a,col){x.save();x.translate(px,py);x.globalAlpha=a;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=r*2.2;x.beginPath();for(let i=0;i<8;i++){const q=i%2?r*.22:r,an=i*Math.PI/4;x.lineTo(Math.cos(an)*q,Math.sin(an)*q)}x.closePath();x.fill();x.restore()}
const t0=performance.now();
function fr(t){const e=t-t0;x.clearRect(0,0,W,H);st.forEach(s=>{const k=Math.min(1,Math.max(0,(e-500-s.d)/700)),w=.5+.5*Math.sin(e/1000*s.s+s.p);if(k*w>.03)star(s.x*W,s.y*H,s.r*(.55+.45*w),k*w,s.c)});if(!done&&!rm)raf=requestAnimationFrame(fr)}
function fin(){if(done)return;done=true;cancelAnimationFrame(raf);sp.classList.add('out');setTimeout(()=>sp.remove(),800)}
addEventListener('resize',rs);sp.addEventListener('click',fin);
if(rm){fr(t0+3500)}else{requestAnimationFrame(fr)}
setTimeout(()=>tb.classList.add('go'),rm?0:400);setTimeout(fin,rm?2200:4400)})();
</script></body></html>
