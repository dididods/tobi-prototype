<style>

.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:496px;background:#ffffffb8;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffffcc;border-radius:34px;box-shadow:0 10px 34px #4a2f8a26;padding:6px;z-index:6}

.wn{background:var(--wrb);color:var(--wr);border-radius:14px;padding:9px 12px;font-size:13px;margin:8px 0}.cq{background:#f6f3fc;border-radius:14px;padding:8px 12px;margin:8px 0}
.emp{text-align:center;padding:30px 16px}.emp .ok{margin:0 auto 10px}.pr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}.pr:first-child{border-top:0}

.dp{background:#ffffffb0;border-radius:20px;padding:10px 10px 12px}.dp .mg{margin-top:6px}.dp .back[disabled]{opacity:.3;cursor:not-allowed}
.dc{aspect-ratio:1;border-radius:14px;background:#fff;font-weight:600;color:var(--in)}.dc.td{box-shadow:inset 0 0 0 2px var(--pu)}.dc.on{background:var(--in);color:#fff}.dc[disabled]{background:transparent;color:#c4bcd6;cursor:not-allowed;font-weight:500;box-shadow:none}

.nd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px}

.nav button.on{background:#e9e5f2;color:var(--ac)}

#sp{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:radial-gradient(90% 55% at 50% 45%,#ffe6f2,#f7bddd 62%,#d3bff7);transition:opacity .7s ease}

/* Етап 7: каталог налаштувань, нагадування, демо-сповіщення */

<script>
const SV=[{id:1,n:"Манікюр + покриття гель-лаком",d:120,p:850},{id:2,n:"Класичний манікюр",d:75,p:500},{id:3,n:"Зняття + манікюр + покриття",d:150,p:950},{id:4,n:"Дизайн (1–2 нігті)",d:30,p:150}];
const WD=["нд","пн","вт","ср","чт","пт","сб"],MN=["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const ST={new:"Новий",conf:"Підтверджено",done:"Завершено",canc:"Скасовано",noshow:"Неявка",block:"Зайнято"};
const D=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+o);return d};
const fd=o=>{const d=D(o);return d.getDate()+" "+MN[d.getMonth()]};
const wd=o=>o==0?"Сьогодні":o==1?"Завтра":WD[D(o).getDay()];
const t2m=t=>{const[a,b]=t.split(":");return +a*60+ +b},m2t=m=>String(m/60|0).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sv=id=>SV.find(s=>s.id==id);
const RMT0="{ім’я}, нагадую про твій запис {дата} о {час} 💅 Підтверджуєш, що все в силі?";
const RMK=[['Ім’я','{ім’я}'],['Дата','{дата}'],['Час','{час}'],['Послуга','{послуга}']];
const NT=[['nw','Новий запис','Клієнтка записалась онлайн'],['ok','Клієнтка підтвердила візит','Відповідь на нагадування'],['cn','Клієнтка скасувала візит','Відповідь на нагадування']];
const TEST=true;/* false = лише іконка профілю */
/* Етап 8: графік. S.wk[день тижня 0–6] = {on, a, b, ba, bb} у хвилинах, ba/bb — перерва або null.
   Усі правила часу спираються на wh() і bkOf(): календар, самозапис, швидкий запис, перенесення, запити. */
function wh(o){const w=S.wk[D(o).getDay()];return[w.a,w.b]}
function bkOf(o){const w=S.wk[D(o).getDay()];return w.ba!=null?[w.ba,w.bb]:null}
const pk=p=>String(p||"").replace(/\D/g,"").slice(-10);/* ключ клієнтки: останні 10 цифр номера */
/* Маска номера: +380 67 111 22 33. Зайві 0, 80 чи 380 на початку прибираються. Номер іншої країни вводиться з «+» і лишається без маски. */
const phE=v=>/^\+?3?8?0?\s*$/.test(v);
function phFmt(v){v=String(v||'').trim();const d=v.replace(/\D/g,'');if(!d)return v[0]=='+'?'+':'';if(v[0]=='+'&&!d.startsWith('380'))return '+'+d.slice(0,15);const n=d.replace(/^(?:380|80|0)+/,'');return '+380 '+[n.slice(0,2),n.slice(2,5),n.slice(5,7),n.slice(7,9)].filter(Boolean).join(' ')}
function phOk(v){v=String(v||'').trim();const d=v.replace(/\D/g,'');return v[0]=='+'&&!d.startsWith('380')?d.length>=10:d.replace(/^(?:380|80|0)+/,'').length==9}
function phIn(el,e){const r=el.value,c=el.selectionStart;if(e&&e.inputType=='deleteContentBackward'&&phE(r))return;const f=phFmt(r);el.value=f;if(c<r.length){const p=Math.min(f.length,c<5&&f.startsWith('+380 ')?5:phFmt(r.slice(0,c)).length);el.setSelectionRange(p,p)}}
function phFoc(el){if(!el.value){el.value='+380 ';el.setSelectionRange(5,5)}}
function phBl(el){if(phE(el.value))el.value=''}
const T0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()},AG=m=>Math.max(T0(),Date.now()-m*6e4);
let S={reqs:[{id:1,type:'new',st:'pending',name:'Софія Гриценко',phone:'+380 68 777 88 99',svc:1,ago:45,o:1,t:'16:00',cm:'Хочу ніжно-рожевий дизайн'},{id:2,type:'move',st:'pending',name:'Наталія Бондар',phone:'+380 66 444 55 66',svc:1,ago:1100,o:2,t:'14:00',aid:4,cm:'Виникли робочі справи'},{id:3,type:'move',st:'pending',name:'Марія Шевчук',phone:'+380 50 222 33 44',svc:2,ago:180,o:1,t:'11:30',aid:2,cm:''}],sset:'',cm:{b:0,w:0},we:{},wf:null,be:{},offs:[],oid:2,wk:[0,1,2,3,4,5,6].map(d=>({on:d!=0,a:540,b:1200,ba:null,bb:null})),rl:{min:120,hor:3,auto:false},ct:'book',prof:null,view:"day",mode:"client",step:1,tab:"cal",day:0,q:"",rm:[{h:24,on:true},{h:1,on:true}],rmt:RMT0,nt:{nw:true,ok:true,cn:true},nq:[],id:30,
sel:{svc:null,day:1,time:null,name:"",phone:"",comment:"",pay:"cash"},last:null,
appts:[
{id:1,o:0,time:"10:00",svc:1,name:"Олена Коваль",phone:"+380 67 111 22 33",st:"done",paid:true,note:"Любить нюд, коротка форма"},
{id:2,o:0,time:"13:00",svc:2,name:"Марія Шевчук",phone:"+380 50 222 33 44",st:"conf",paid:false,note:""},
{id:3,o:0,time:"15:30",svc:3,name:"Ірина Мельник",phone:"+380 93 333 44 55",st:"new",paid:false,note:"",cm:"Хочу французький дизайн",client:true,cat:AG(25)},
{id:4,o:1,time:"11:00",svc:1,name:"Наталія Бондар",phone:"+380 66 444 55 66",st:"new",paid:false,note:"",client:true,cat:AG(70)},
{id:5,o:1,time:"14:30",svc:2,name:"Олена Коваль",phone:"+380 67 111 22 33",st:"conf",paid:false,note:""},
{id:6,o:2,time:"10:30",svc:3,name:"Катерина Лисенко",phone:"+380 99 555 66 77",st:"new",paid:false,note:"",client:true,cat:AG(120)},
{id:7,o:-14,time:"12:00",svc:1,name:"Олена Коваль",phone:"+380 67 111 22 33",st:"done",paid:true,note:""},
{id:8,o:-7,time:"16:00",svc:2,name:"Марія Шевчук",phone:"+380 50 222 33 44",st:"done",paid:true,note:"Алергія на один бренд бази — уточнити"}],
wait:[{id:1,name:'Софія Гриценко',phone:'+380 68 777 88 99',svc:2,o:1,mode:'after',t1:'15:00',t2:''},{id:2,name:'Вікторія Мазур',phone:'+380 97 888 99 00',svc:1,o:0,mode:'any',t1:'',t2:''}]};
const $=s=>document.querySelector(s);
/* Тривалість запису: послуга + додатковий час саме цього запису (a.ex). a.xm — хвилини, які не вмістилися */
const apD=a=>a.svc?sv(a.svc).d+(a.ex||0):a.dur||30;
function clEx(ph){const c=S.cl[pk(ph)];return c&&c.ex||0}
function tFree(o,m,d,ign){const[h0,h1]=wh(o);return !isOff(o)&&m>=h0&&m+d<=h1&&!busy(o,ign).some(b=>m<b[1]&&m+d>b[0])}
/* Додатковий час застосовується повністю або не застосовується, але запис ніколи не відхиляється через нього */
function exPut(a,off){const w=clEx(a.phone),x=!off&&w&&tFree(a.o,t2m(a.time),sv(a.svc).d+w,a.id)?w:0;a.ex=x;a.xm=w&&!x?w:0;return x==w}
function dTx(a){return `${sv(a.svc).d}${a.ex?' + '+a.ex:''} хв${a.xm?' · без +'+a.xm:''}`}
function busy(o,ign){const r=[];S.appts.filter(a=>a.o==o&&a.st!="canc"&&a.st!="noshow"&&a.id!=ign).forEach(a=>{const s=t2m(a.time);r.push([s,s+apD(a)])});return r}
/* p: запис зачіпає перерву, pi: починається вже під час перерви. Майстриня може такий час обрати, клієнтка — ні.
   ps: час уже минув, обрати не можна (крім власного часу запису, який редагують) */
function slots(o,dur,ign,ex){if(isOff(o))return[];const b=busy(o,ign),[h0,h1]=wh(o),bk=bkOf(o),o0=D(o).getTime(),nw=Date.now(),ka=ign!=null&&S.appts.find(a=>a.id==ign&&a.o==o),r=[],hit=(m,d)=>b.some(x=>m<x[1]&&m+d>x[0]);for(let m=h0;m+dur<=h1;m+=30){const f=!hit(m,dur);r.push({t:m2t(m),f,ps:o0+m*6e4<=nw&&!(ka&&t2m(ka.time)==m),p:!!bk&&m<bk[1]&&m+dur>bk[0],pi:!!bk&&m>=bk[0]&&m<bk[1],x:!!ex&&f&&(m+dur+ex>h1||hit(m,dur+ex))})}return r}
/* Список годин у кабінеті: час, де вміщається лише звичайна тривалість, доступний із позначкою */
function tPut(ts,sl,ex,cur,keep){if(keep&&!sl.some(x=>x.t==keep))sl=sl.concat({t:keep,f:true,k:1}).sort((a,b)=>t2m(a.t)-t2m(b.t));ts.innerHTML=sl.map(x=>{const off=!x.f||x.ps;return `<option value="${x.t}" ${x.x?'data-x="1"':''} ${off?'disabled style="color:#a9a3b8"':''}>${x.t}${x.k?' · поточний час':!x.f?' · зайнято':x.ps?' · минуло':x.p?(x.pi?' · перерва':' · зачепить перерву'):x.x?' · без +'+ex+' хв':''}</option>`}).join('');ts.value=cur;if(!ts.value||!ts.selectedOptions[0]||ts.selectedOptions[0].disabled){const ok=x=>x.f&&!x.ps,f=sl.find(x=>ok(x)&&!x.x&&!x.p)||sl.find(x=>ok(x)&&!x.p)||sl.find(ok);if(f)ts.value=f.t}}
function toast(m){$("#ts").innerHTML=`<div class="toast" role="status">${m}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#ts").innerHTML="",2600)}
function sheet(h){$("#ov").innerHTML=`<div class="ov" onclick="if(event.target==this)closeS()"><div class="sh" role="dialog" aria-modal="true">${h.includes('class="xb"')?'':'<button class="xb sx" aria-label="Закрити" onclick="closeS()">✕</button>'}${h}</div></div>`}
function closeS(){$("#ov").innerHTML="";closeS2()}
/* Другий шар: вікно поверх відкритої картки; після закриття картка лишається на місці */
function sheet2(h,still){const old=$('#ov2 .sh'),sc=still&&old?old.scrollTop:0;$("#ov2").innerHTML=`<div class="ov" onclick="if(event.target==this)closeS2()"><div class="sh" role="dialog" aria-modal="true">${h}</div></div>`;if(still){const x=$('#ov2 .sh');x.scrollTop=sc;x.style.animation='none'}}
function closeS2(){$("#ov2").innerHTML=""}
function topbar(){return `<div class="top"><span class="bm" aria-hidden="true">Т</span>${TEST?`<div class="seg" title="Тестовий перемикач"><button class="${S.mode=="client"?"on":""}" onclick="mode('client')">Клієнтка</button><button class="${S.mode=="master"?"on":""}" onclick="mode('master')">Кабінет майстра</button></div>`:`<span class="logo">Тобі</span>`}<button class="prof ${S.mode=="master"?"on":""}" aria-label="Кабінет майстра" onclick="mode(S.mode=='master'?'client':'master')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button></div>`}
function mode(m){const p=S.mode;S.mode=m;render();scrollTo(0,0);if(m=='master')dnShow();else if(p=='master'){S.nq=[];dnShow()}}
function render(){autoDone();syncCl();$("#app").innerHTML=topbar()+(S.mode=="client"?client():master());
$("#app").insertAdjacentHTML("beforeend",S.mode=="master"?`<nav class="nav"><div>${[["cal","Календар",'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/>'],["cl","Клієнтки",'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0m2-13a4 4 0 0 1 0 8m1 2a6 6 0 0 1 3 5"/>'],"+",["rq","Запити",'<path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/>'],["st","Налаштування",'<path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']].map(x=>x=="+"?`<button class="fab" aria-label="Новий запис" onclick="quick()">＋</button>`:`<button class="${S.tab==x[0]?"on":""}" onclick="S.tab='${x[0]}';${x[0]=='st'?"S.sset='';":''}render()"><svg viewBox="0 0 24 24">${x[2]}</svg>${x[1]}${x[0]=="rq"&&pend()?`<i class="bdg">${pend()}</i>`:""}</button>`).join("")}</div></nav>`:clientNav())}
/* ---------- CLIENT ---------- */
function client(){if(S.ct=='prof')return profV();const s=S.sel,st=S.step;
/* Кроки: 1 послуга, 1.5 телефон, 2 дата й час, 3 дані, 4 готово */
const pos={1:1,1.5:2,2:3,3:4}[st]||5,bar=`<div class="steps">${[1,2,3,4].map(i=>`<i class="${i<=pos?"on":""}"></i>`).join("")}</div>`;
if(st==1)return `<h1>Обери свою послугу</h1><p class="mu">Запис займе хвилину, реєстрація не потрібна.</p>${bar}
${rep()}
${SV.filter(x=>!x.off).map(x=>`<button class="card svc" onclick="pick(${x.id})"><span><b>${esc(x.n)}</b>${x.desc?`<span class="sm mu" style="display:block">${esc(x.desc)}</span>`:""}<span class="sm mu">${x.d} хв</span></span><span class="price">${x.p} ₴</span></button>`).join("")}`;
if(st==1.5){const v=sv(s.svc),e=S.be||{};return `<button class="back" aria-label="Назад до послуг" onclick="S.step=1;render()">← Послуги</button><h1>Твій номер телефону</h1>${bar}<p class="mu sm">${esc(v.n)} · ${v.d} хв · ${v.p} ₴</p>
<label class="f" for="ph0">Телефон <span class="rq">*</span></label><input id="ph0" class="${e.p?'bad':''}" type="tel" value="${esc(phFmt(s.phone))}" placeholder="+380" autocomplete="tel" onfocus="phFoc(this)" onblur="phBl(this);S.sel.phone=this.value" oninput="phIn(this,event);S.sel.phone=this.value;clrE(this,'p')" onkeydown="if(event.key=='Enter')phNext()">${e.p?`<div class="er">${e.p}</div>`:''}
<button class="btn" onclick="phNext()">Далі</button>`}
if(st==2){const v=sv(s.svc),sl=cslots(s.day,cD(s.svc)),free=sl.filter(x=>x.f).length;
return `<button class="back" aria-label="${S.prof?'Назад до послуг':'Назад до телефону'}" onclick="S.step=${S.prof?1:1.5};render()">← ${S.prof?'Послуги':'Телефон'}</button><h1>Коли тобі зручно?</h1>${bar}<p class="mu sm">${esc(v.n)} · ${v.d} хв · ${v.p} ₴</p>
${dpick('b',s.day,o=>cslots(o,cD(s.svc)).some(x=>x.f))}
<h2>${wd(s.day)}, ${fd(s.day)}</h2>
<div class="slots">${sl.map(x=>`<button class="slot ${s.time==x.t?"on":""}" ${x.f?"":"disabled"} onclick="S.sel.time='${x.t}';render()">${x.t}</button>`).join("")}</div>
${free<3?`<p class="sm mu">Вільних вікон майже немає.</p>`:""}
<button class="btn g" onclick="waitSheet()">Потрібного часу немає — стати в чергу</button>
<button class="btn" ${s.time?"":"disabled"} onclick="S.be={};S.step=3;render()">Далі</button>${s.time?'':'<p class="sm mu" style="text-align:center;margin:6px 0 0">Оберіть дату й час</p>'}`}
if(st==3){const v=sv(s.svc),e=S.be||{};return `<button class="back" aria-label="Назад до дати й часу" onclick="sv2();S.step=2;render()">← Дата й час</button><h1>Як до тебе звертатися?</h1>${bar}
<div class="card"><b>${esc(v.n)}</b><div class="sm mu">${wd(s.day)}, ${fd(s.day)} о ${s.time} · ${v.d} хв</div></div>
<p class="sm mu" style="margin:0"><span class="rq">*</span> — обов’язкові поля</p>
<label class="f">Ім’я <span class="rq">*</span></label><input id="nm" class="${e.n?'bad':''}" value="${esc(s.name||(S.prof?S.prof.name:''))}" autocomplete="name" oninput="clrE(this,'n')">${e.n?`<div class="er">${e.n}</div>`:''}
<label class="f">Телефон</label><div class="card row2 pho"><span>${esc(s.phone)}</span><button type="button" class="back" onclick="sv2();S.step=1.5;render()">Змінити</button></div>
<label class="f">Коментар (за бажанням)</label><textarea id="cm">${esc(s.comment)}</textarea>
<label class="f" id="pl">Спосіб оплати</label><div class="pay" role="radiogroup" aria-labelledby="pl">${[['cash','Готівка'],['card','Переказ на картку']].map(k=>`<button type="button" role="radio" aria-checked="${s.pay==k[0]}" class="po ${s.pay==k[0]?'on':''}" onclick="sv2();S.sel.pay='${k[0]}';render()"><i class="rd">${s.pay==k[0]?'✓':''}</i>${k[1]}</button>`).join('')}</div>
${S.prof?'':`<label class="row2 sm" style="justify-content:flex-start;gap:10px;margin-top:12px"><input id="rm" type="checkbox" style="width:20px;height:20px" ${s.rm?'checked':''}> Запам’ятати мої дані для наступних записів</label>`}
<div class="row2" style="margin-top:14px"><span class="mu">До сплати</span><b>${v.p} ₴</b></div>
<button class="btn" onclick="book()">Підтвердити запис</button>`}
const a=S.last,v=sv(a.svc);return `<div class="ok">✓</div>${a.st=="conf"?`<h1>Ти записана, ${esc(a.name.split(" ")[0])}!</h1><p class="mu">Чекаю на тебе. Деталі запису нижче.</p>`:`<h1>Запис надіслано, ${esc(a.name.split(" ")[0])}!</h1><p class="mu">Майстриня підтвердить його найближчим часом.</p>`}
<div class="card"><b>${esc(v.n)}</b><div>${wd(a.o)}, ${fd(a.o)} о ${a.time}</div><div class="sm mu">${v.d} хв · ${v.p} ₴ · ${a.pay=="cash"?"готівка":"переказ на картку"}</div><hr style="border:0;border-top:1px solid var(--ln)"><div class="sm">${esc(a.name)}, ${esc(a.phone)}</div>${a.cm?`<div class="sm mu">«${esc(a.cm)}»</div>`:""}</div>
<button class="btn g" onclick="toast('Додано в календар (демо)')">Додати до мого календаря</button>
${TEST?`<button class="btn" onclick="S.mode='master';S.tab='cal';S.day=${a.o};render()">Подивитись у кабінеті майстра</button>`:''}
<button class="back" style="margin-top:8px" onclick="S.step=1;S.sel={svc:null,day:1,time:null,name:'',phone:'',comment:'',pay:'cash'};render()">Новий запис</button>`}
function setSvc(id){const ch=S.sel.svc!=id;S.sel.svc=id;if(ch||!okDay(S.sel.day,id)){S.sel.time=null;S.sel.day=firstOk(id)}S.cm.b=mDiff(S.sel.day)}
/* Тривалість для самозапису: клієнтка бачить звичайну тривалість, але вільний час рахується з її додатковими хвилинами */
function cD(id){return sv(id).d+clEx(S.sel.phone)}
function pick(id){const s=S.sel;if(S.prof&&!s.phone)s.phone=S.prof.phone;S.be={};setSvc(id);S.step=S.prof?2:1.5;render();scrollTo(0,0)}
function phNext(){const s=S.sel;s.phone=phFmt($('#ph0').value);if(!phOk(s.phone)){S.be={p:'Вкажіть номер телефону повністю'};render();$('#ph0').focus();return}S.be={};if(!okDay(s.day,s.svc)){s.day=firstOk(s.svc);s.time=null}else if(s.time&&!cslots(s.day,cD(s.svc)).some(x=>x.t==s.time&&x.f))s.time=null;S.cm.b=mDiff(s.day);S.step=2;render();scrollTo(0,0)}
function repeat(id){Object.assign(S.sel,{name:S.prof.name,phone:S.prof.phone});setSvc(id);S.sel.time=null;S.step=2;render();toast('Дані підставлено — оберіть нову дату')}
function sv2(){const q=x=>document.querySelector(x);if(!q("#nm"))return;S.sel.name=q("#nm").value;S.sel.comment=q("#cm").value;const r=q("#rm");if(r)S.sel.rm=r.checked}

const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()},TT=(a,b)=>{const r=[];for(let m=a;m<=b;m+=30)r.push(m2t(m));return r};

function dHor(n){const d=new Date();d.setHours(0,0,0,0);d.setMonth(d.getMonth()+(n||3));return Math.round((d-D(0))/864e5)}

function mDiff(o){const a=D(0),b=D(o);return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()}

function dpick(ctx,sel,ok){const m=S.cm[ctx]||0,b=D(0),first=new Date(b.getFullYear(),b.getMonth()+m,1),n=new Date(b.getFullYear(),b.getMonth()+m+1,0).getDate(),f=Math.round((first-D(0))/864e5),pad=(first.getDay()+6)%7,h=cHor();let c='';for(let i=0;i<pad;i++)c+='<span></span>';
for(let i=0;i<n;i++){const o=f+i,en=o>=0&&o<=h&&ok(o);c+=`<button type="button" class="dc ${o==sel?'on':''} ${o==0?'td':''}" ${en?'':'disabled'} aria-label="${i+1} ${MN[first.getMonth()]}${en?'':', недоступно'}" onclick="dsel('${ctx}',${o})">${i+1}</button>`}

function dsel(ctx,o){if(ctx=='b'){S.sel.day=o;S.sel.time=null;render()}else{S.wf.o=o;delete S.we.o;wRender(1)}}

function wfit(w,a){if(w.o!=a.o)return false;const m=t2m(a.time);return w.mode=='any'||(w.mode=='before'&&m<=t2m(w.t1))||(w.mode=='after'&&m>=t2m(w.t1))||(w.mode=='between'&&m>=t2m(w.t1)&&m<=t2m(w.t2))}
function waitSheet(){if(!S.wf){const s=S.sel;S.wf={svc:s.svc||'',o:s.day,mode:'',t1:'',t2:'',name:s.name||(S.prof?S.prof.name:''),phone:s.phone||(S.prof?S.prof.phone:'')};S.we={};S.cm.w=mDiff(S.wf.o)}wRender()}

sheet(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Список очікування</h2><p class="mu sm" style="margin:0">Це заявка на бажані умови, а не бронювання. Майстриня сама запропонує вільне віконце.</p></div><button class="xb" aria-label="Закрити" onclick="closeS()">✕</button></div>

<label class="f" id="wml">Бажаний час <span class="rq">*</span></label><div class="pay" role="radiogroup" aria-labelledby="wml">${WM.map(x=>`<button type="button" role="radio" aria-checked="${f.mode==x[0]}" class="po ${f.mode==x[0]?'on':''}" onclick="wMode('${x[0]}')"><i class="rd">${f.mode==x[0]?'✓':''}</i>${x[1]}</button>`).join('')}</div>${er('mode')}${tf}
<div class="g2 np"><div><label class="f">Ім’я <span class="rq">*</span></label><input id="wn" class="${bd('name')}" value="${esc(f.name)}" autocomplete="name" oninput="S.wf.name=this.value;clrW(this,'name')">${er('name')}</div><div><label class="f">Телефон <span class="rq">*</span></label><input id="wp" type="tel" class="${bd('phone')}" value="${esc(phFmt(f.phone))}" placeholder="+380" autocomplete="tel" onfocus="phFoc(this)" onblur="phBl(this);S.wf.phone=this.value" oninput="phIn(this,event);S.wf.phone=this.value;clrW(this,'phone')">${er('phone')}</div></div>
<div class="row2" style="gap:10px;margin-top:16px"><button class="btn g" style="margin:0" onclick="closeS()">Скасувати</button><button class="btn" style="margin:0" onclick="wSend()">Надіслати заявку</button></div>`);
if(k){const h=$('.sh');h.scrollTop=sc;h.style.animation='none'}}

function wSend(){const f=S.wf,e={};if(!f.svc)e.svc='Оберіть послугу';if(f.o==null||f.o<0)e.o='Оберіть дату';else if(isOff(f.o)||f.o>cHor())e.o='Цей день недоступний, оберіть інший';
if(!f.mode)e.mode='Оберіть, коли вам зручно';else if(f.mode=='before'||f.mode=='after'){if(!f.t1)e.t1='Вкажіть час'}else if(f.mode=='between'){if(!f.t1)e.t1='Вкажіть початок';if(!f.t2)e.t2='Вкажіть кінець';if(f.t1&&f.t2&&t2m(f.t1)>=t2m(f.t2))e.t2='Кінець має бути пізніше за початок'}
if(!f.name.trim())e.name='Вкажіть ім’я';if(!phOk(f.phone))e.phone='Вкажіть номер повністю';
if(Object.keys(e).length){S.we=e;wRender(1);setTimeout(()=>{const x=document.querySelector('.sh .er');if(x)x.scrollIntoView({block:'center',behavior:'smooth'})},60);return}
const dp=S.wait.some(w=>pk(w.phone)==pk(f.phone)&&w.o==f.o&&w.svc==+f.svc&&w.mode==f.mode&&w.t1==(f.mode=='any'?'':f.t1)&&w.t2==(f.mode=='between'?f.t2:''));
if(dp){toast('Така заявка вже є у списку очікування');return}

/* Що чекає рішення майстрині — ЄДИНЕ правило для лічильника в календарі, бейджа й вкладки «Запити».
   Не залежить від обраного дня. new — записи «Новий» (самозапис клієнток, зокрема з минулим часом)
   і запити на новий запис; move — запити на перенесення. */
function attn(){const r=S.reqs.filter(x=>x.st=='pending'),a=S.appts.filter(x=>x.st=='new'&&x.svc);return{a,rn:r.filter(x=>x.type!='move'),rm:r.filter(x=>x.type=='move')}}
function pend(){const t=attn();return t.a.length+t.rn.length+t.rm.length}
function pl(n,a,b,c){const m=n%10,h=n%100;return h>10&&h<20?c:m==1?a:m>1&&m<5?b:c}
function cr(m){const d=new Date(Date.now()-m*6e4),n=new Date(),t=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),y=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return(y<1?'Сьогодні':y==1?'Вчора':d.getDate()+' '+MN[d.getMonth()])+', '+t}
function dl(o,t){return wd(o)+', '+fd(o)+' · '+t}
function rqOk(r){const a=r.type=='move'?S.appts.find(x=>x.id==r.aid):null;if(r.type=='move'&&(!a||!['new','conf'].includes(a.st)))return 'gone';const d=sv(r.svc).d,s=t2m(r.t);if(r.o<0||(r.o==0&&s<=nowMin()))return 'past';if(isOff(r.o)||s<wh(r.o)[0]||s+d>wh(r.o)[1])return 'busy';return busy(r.o,a?a.id:-1).some(b=>s<b[1]&&s+d>b[0])?'busy':'ok'}
/* Скільки додаткових хвилин не вміщається на бажаний час запиту */
function rqEx(r){const w=clEx(r.phone),a=r.type=='move'?S.appts.find(x=>x.id==r.aid):null;return w&&!tFree(r.o,t2m(r.t),sv(r.svc).d+w,a?a.id:-1)?w:0}
function rqCard(r){const v=sv(r.svc),mv=r.type=='move',a=mv?S.appts.find(x=>x.id==r.aid):null,c=rqOk(r),xw=clEx(r.phone),xs=c=='ok'?rqEx(r):0;
return `<div class="card"><div class="row2"><b>${esc(r.name)}</b><span class="chip new">Очікує підтвердження</span></div><div class="sm mu">${esc(r.phone)}</div>
<div class="row2" style="margin-top:10px"><span class="chip done">${mv?'Перенесення':'Новий запис'}</span><span class="sm mu">${cr(r.ago)}</span></div>
${mv?`<div class="cmp"><div><small>Зараз</small><b>${a?dl(a.o,a.time):'—'}</b></div><span>→</span><div><small>Бажано</small><b>${dl(r.o,r.t)}</b></div></div>`:`<div class="cmp"><div><small>Запис на</small><b>${dl(r.o,r.t)}</b></div></div>`}
<div class="row2 sm"><span>${esc(v.n)}${xw&&c=='ok'?` · ${v.d}${xs?'':' + '+xw} хв`:''}</span><b class="price">${v.p} ₴</b></div>
${r.cm?`<div class="cq sm">💬 ${esc(r.cm)}</div>`:''}
${xs?`<div class="wn">Додаткові +${xs} хв тут не вміщаються. Можна підтвердити запис без них.</div>`:''}${c=='busy'?`<div class="wn">Цей час уже зайнятий. Відхиліть запит або узгодьте інший час із клієнткою.</div>`:c=='gone'?`<div class="wn">Початковий запис уже недоступний. Відхиліть запит.</div>`:c=='past'?`<div class="wn">Бажаний час уже минув. Запропонуйте інший час або відхиліть запит.</div>`:''}
<button class="btn" ${c=='ok'?'':'disabled'} onclick="rqAct(${r.id},1)">${mv?'Підтвердити перенесення':'Підтвердити запис'}</button><button class="btn ${c=='ok'?'g':''}" onclick="offerT(${r.id})">Запропонувати інший час</button><button class="btn g" style="color:var(--bad)" onclick="rqAct(${r.id},0)">Відхилити</button></div>`}

function reqs(){const t=attn(),n=pend(),nn=t.a.length+t.rn.length,nm=t.rm.length,g=S.rqt||(nn||!nm?'new':'move');

/* Єдине місце з правилами статусів.

function stOk(a,s){const n=Date.now();if(a.st=='new')return s=='conf'||s=='canc';if(a.st=='conf')return s=='canc'||((s=='done'||s=='noshow')&&n>=st0(a));if(a.st=='done')return s=='noshow';if(a.st=='noshow')return s=='done';if(a.st=='canc')return s=='restore';return false}

if((from=='canc'||from=='noshow')&&to!='canc'&&to!='noshow'){const m=t2m(a.time),d=sv(a.svc).d;const bz=busy(a.o,a.id).some(b=>m<b[1]&&m+d>b[0]);if(bz||(a.o>=0&&!tFree(a.o,m,d,a.id))){toast(bz?'Цей час уже зайнятий іншим записом. Створіть новий запис на вільний час':isOff(a.o)?'Цей день тепер вихідний. Створіть новий запис на інший день':'Цей час тепер поза робочими годинами. Створіть новий запис на вільний час');open_(id);return}}
if(to=='canc')a.prev=from;a.st=to;a.seen=true;if(from=='canc')exPut(a);if(from=='new')a.dec={r:to,t:Date.now()};if(to=='new')delete a.dec;if(to=='done'){a.paid=true;delete a.auto}if(to=='noshow')a.paid=false;

if(still){const x=$('#ov .sh');x.scrollTop=sc;x.style.animation='none'}}

/* Зміна імені та кольору — вікно поверх картки */
function clEd(k){const c=cliMap()[k];if(!c)return;S.cc=c.cl.c;sheet2(`<div class="row2" style="align-items:flex-start"><h2 style="margin-top:0">Редагувати клієнтку</h2><button class="xb" aria-label="Закрити" onclick="closeS2()">✕</button></div>

<div class="row2" style="gap:10px;margin-top:16px"><button class="btn g" style="margin:0" onclick="closeS2()">Скасувати</button><button class="btn" style="margin:0" onclick="clSv('${k}')">Зберегти</button></div>`)}
function clPk(i){S.cc=i;document.querySelectorAll('.ccb').forEach((b,j)=>{b.classList.toggle('on',j==i);b.setAttribute('aria-checked',j==i);b.textContent=j==i?'✓':''})}
function clSv(k){const el=$('#cen'),n=el.value.trim();if(!n){if(!el.classList.contains('bad')){el.classList.add('bad');el.insertAdjacentHTML('afterend','<div class="er">Вкажіть ім’я</div>')}el.focus();return}
if(n!=cliMap()[k].name)clRn(k,n);S.cl[k].c=S.cc;closeS2();render();cli(k,1);toast('Збережено')}
/* Коментарі про клієнтку — вікно поверх картки; клієнтки їх не бачать */
function cmOpen(k){S.ce=0;S.cd='';S.cdE=0;cmS(k)}
function cmS(k,still){const c=cliMap()[k];if(!c)return;const L=c.cl.cms.slice().sort((a,b)=>b.t-a.t);
sheet2(`<div class="row2" style="align-items:flex-start"><div><h2 style="margin-top:0">Коментарі</h2><p class="mu sm" style="margin:0">${esc(c.name)} · бачите лише ви</p></div><button class="xb" aria-label="Закрити" onclick="closeS2()">✕</button></div>
<label class="f" for="cmn">Новий коментар</label><textarea id="cmn" class="${S.cdE?'bad':''}" maxlength="500" placeholder="Що важливо пам’ятати про клієнтку" oninput="S.cd=this.value;S.cdE=0;clrE(this,'c')">${esc(S.cd)}</textarea>${S.cdE?'<div class="er">Напишіть текст коментаря</div>':''}
<button class="btn" onclick="cmAdd('${k}')">Додати коментар</button>
${L.length?L.map(x=>S.ce==x.id?`<div class="card cmi"><label class="f" for="cme" style="margin-top:0">Редагування коментаря</label><textarea id="cme" maxlength="500">${esc(x.x)}</textarea><div class="row2" style="gap:10px;margin-top:10px"><button class="btn g" style="margin:0" onclick="S.ce=0;cmS('${k}',1)">Скасувати</button><button class="btn" style="margin:0" onclick="cmSv('${k}',${x.id})">Зберегти</button></div></div>`:`<div class="card cmi"><div class="cmt">${esc(x.x)}</div><div class="row2" style="margin-top:8px"><span class="sm mu">${cr((Date.now()-x.t)/6e4)}${x.ed?' · змінено':''}</span><span class="row2" style="gap:6px"><button class="ib" aria-label="Редагувати коментар" onclick="S.ce=${x.id};cmS('${k}',1)">${IC.ed}</button><button class="ib dl" aria-label="Видалити коментар" onclick="cmDl('${k}',${x.id})">${IC.tr}</button></span></div></div>`).join(''):'<div class="brk" style="margin-top:14px">Коментарів ще немає.</div>'}`,still)}
function cmAdd(k){const x=S.cd.trim();if(!x){S.cdE=1;cmS(k,1);$('#cmn').focus();return}S.cl[k].cms.push({id:S.cmid++,t:Date.now(),x});S.cd='';S.cdE=0;cmS(k,1);cli(k,1);toast('Коментар додано')}
function cmSv(k,id){const x=$('#cme').value.trim();if(!x){toast('Коментар не може бути порожнім');return}const m=S.cl[k].cms.find(y=>y.id==id);if(m){m.x=x;m.ed=Date.now()}S.ce=0;cmS(k,1);toast('Коментар змінено')}
function cmDl(k,id){const m=S.cl[k].cms.find(y=>y.id==id);if(!m)return;sheet2(`<h2 style="margin-top:0">Видалити коментар?</h2><div class="cq sm cmt">${esc(m.x)}</div><p class="sm">Відновити його після видалення не вийде.</p><button class="btn" style="background:var(--bad);box-shadow:none" onclick="cmDlY('${k}',${id})">Так, видалити</button><button class="btn g" onclick="cmS('${k}',1)">Назад</button>`,1)}
function cmDlY(k,id){S.cl[k].cms=S.cl[k].cms.filter(y=>y.id!=id);S.ce=0;cmS(k,1);cli(k,1);toast('Коментар видалено')}
/* Додатковий час клієнтки: застосовується до майбутніх записів, де вміщається; решта лишаються без змін */
function clExS(k,x){const c=cliMap()[k];if(!c||(c.cl.ex||0)==x)return;c.cl.ex=x;const L=c.v.filter(a=>clAct(a)&&st0(a)>Date.now()),bad=L.filter(a=>!exPut(a));render();cli(k,1);
if(!bad.length){toast(L.length?`Збережено. Оновлено записів: ${L.length}`:'Збережено');return}
sheet2(`<div class="row2" style="align-items:flex-start"><h2 style="margin-top:0">Не всюди вмістилося</h2><button class="xb" aria-label="Закрити" onclick="closeS2()">✕</button></div><p class="sm">Ці записи залишаються на своєму часі без +${x} хв. Нікого не скасовано й не перенесено. Якщо поруч звільниться час, додайте хвилини в редагуванні запису.</p>
${bad.map(a=>`<button class="card ap" style="margin:8px 0" onclick="closeS();open_(${a.id})"><div class="b"><div><b>${esc(sv(a.svc).n)}</b><span class="chip ${a.st}">${ST[a.st]}</span></div><div class="sm mu">${dl(a.o,a.time)}</div></div></button>`).join('')}
<button class="btn g" onclick="closeS2()">Зрозуміло</button>`)}
/* Видалення клієнтки: минулі записи лишаються в календарі, активні записи й запити спершу треба вирішити */
function clDel(k){const c=cliMap()[k];if(!c)return;const A=c.v.filter(clAct),R=S.reqs.filter(r=>r.st=='pending'&&pk(r.phone)==k);
if(A.length||R.length){sheet2(`<div class="row2" style="align-items:flex-start"><h2 style="margin-top:0">Поки не можна видалити</h2><button class="xb" aria-label="Закрити" onclick="closeS2()">✕</button></div><p class="sm">У клієнтки ${esc(c.name)} є незавершені справи. Скасуйте запис або дочекайтеся його завершення, а запит підтвердьте чи відхиліть.</p>
${A.map(a=>`<button class="card ap" style="margin:8px 0" onclick="closeS();open_(${a.id})"><div class="b"><div><b>${esc(sv(a.svc).n)}</b><span class="chip ${a.st}">${ST[a.st]}</span></div><div class="sm mu">${dl(a.o,a.time)}</div></div></button>`).join('')}
${R.map(r=>`<button class="card ap" style="margin:8px 0" onclick="clRq('${r.type=='move'?'move':'new'}')"><div class="b"><div><b>${r.type=='move'?'Запит на перенесення':'Запит на новий запис'}</b></div><div class="sm mu">${dl(r.o,r.t)}</div></div></button>`).join('')}
<button class="btn g" onclick="closeS2()">Зрозуміло</button>`);return}
const n=c.cl.cms.length,w=S.wait.filter(x=>pk(x.phone)==k).length;
sheet2(`<h2 style="margin-top:0">Видалити клієнтку?</h2><div class="cq sm">${esc(c.name)} · ${esc(c.phone)}</div>
<p class="sm"><b>Зникне назавжди:</b> картка${n?`, коментарі (${n})`:''}${c.cl.sn?', коротка замітка':''}, колір смужки${w?`, заявки у списку очікування (${w})`:''}.</p>
<p class="sm"><b>Залишиться:</b> минулі записи в календарі та історія у «Запитах».</p>
<p class="sm mu">Якщо клієнтка запишеться знову, її минулі візити повернуться в нову картку.</p>
<button class="btn" style="background:var(--bad);box-shadow:none" onclick="clDelY('${k}')">Так, видалити</button><button class="btn g" onclick="closeS2()">Назад</button>`)}
function clDelY(k){delete S.cl[k];S.clx[k]=S.id;S.wait=S.wait.filter(x=>pk(x.phone)!=k);closeS();render();toast('Клієнтку видалено')}
function clRq(t){closeS();S.tab='rq';S.rqt=t;render();scrollTo(0,0)}
function nextAp(){const n=Date.now();return S.appts.filter(a=>a.svc&&["new","conf"].includes(a.st)&&st0(a)>n).sort((a,b)=>a.o-b.o||t2m(a.time)-t2m(b.time))[0]}
/* Нагадування: нічого не надсилається, це попередній перегляд */
const rmL=h=>`За ${h} ${pl(h,'годину','години','годин')} до візиту`;
function rmTx(a){return (S.rmt.trim()||RMT0).replace(/\{ім['’]я\}/gi,a.name.split(' ')[0]).replace(/\{дата\}/gi,fd(a.o)).replace(/\{час\}/gi,a.time).replace(/\{послуга\}/gi,sv(a.svc).n)}
function rem(){if(!S.rmt.trim())S.rmt=RMT0;const a=nextAp();return `<h1>Нагадування та сповіщення</h1><div class="wn"><b>Це попередній перегляд.</b> Повідомлення поки не надсилаються.</div>
<h2 style="margin-top:18px">Повідомлення клієнткам</h2><label class="f">Коли нагадувати</label>
${S.rm.map((r,i)=>`<div class="card row2 rmr"><button class="rmb" onclick="rmSh(${i})"><b>${i?'Друге':'Перше'} нагадування</b><span class="sm">${rmL(r.h)} ›</span></button><button class="tog ${r.on?'on':''}" aria-label="${i?'Друге':'Перше'} нагадування" aria-pressed="${r.on}" onclick="rmOn(${i})"></button></div>`).join('')}
<label class="f" for="rmt">Текст повідомлення</label><textarea id="rmt" rows="4" maxlength="300" oninput="rmIn(this)">${esc(S.rmt)}</textarea><div class="er" id="rme" hidden>Поле порожнє, тому буде стандартний текст</div>
<div class="sm mu" style="margin-top:8px">Додати в текст дані клієнтки:</div><div class="xts rmc">${RMK.map((k,i)=>`<button class="xo" onmousedown="event.preventDefault()" onclick="rmIns(${i})">${k[0]}</button>`).join('')}</div>
<div class="rmf"><span class="sm mu" id="rmn">${S.rmt.length} / 300</span><button class="lk" onclick="rmRs()">Повернути стандартний</button></div>
<label class="f">Як це виглядатиме</label>
${a?`<div class="tg"><div class="sm" style="margin-bottom:6px">Приклад для: <b>${esc(a.name)}</b></div><div class="m cmt" id="rmp">${esc(rmTx(a))}</div><div class="k"><button onclick="reply(${a.id},'conf')">Підтверджую</button><button onclick="reply(${a.id},'canc')">Не зможу прийти</button></div></div>
<p class="sm mu">Кнопки працюють для перевірки: вони змінюють статус цього запису в календарі. Зараз: <span class="chip ${a.st}">${ST[a.st]}</span> · ${wd(a.o)}, ${a.time}</p>`:`<div class="brk">Немає майбутніх записів для прикладу.</div>`}
<label class="f">Канали доставки</label><div class="card" style="padding:4px 16px;margin-top:0">${['Telegram','Viber'].map(x=>`<div class="pr"><span>${x}</span><span class="chip done">Незабаром</span></div>`).join('')}</div>
<h2 style="margin-top:22px">Сповіщення майстрині</h2><p class="sm mu" style="margin:0 0 8px">Поки що вони з’являються лише в кабінеті з позначкою «Демо». На телефон не приходять. Нові записи й запити також видно в лічильнику вкладки «Запити».</p>
<div class="card" style="padding:4px 16px;margin-top:0">${NT.map(n=>`<div class="pr"><span style="min-width:0">${n[1]}<br><span class="sm mu">${n[2]}</span></span><button class="tog ${S.nt[n[0]]?'on':''}" aria-label="${n[1]}" aria-pressed="${!!S.nt[n[0]]}" onclick="ntT('${n[0]}')"></button></div>`).join('')}<div class="pr"><span style="min-width:0">Запит на перенесення</span><span class="chip done">Незабаром</span></div></div>`}
function rmOn(i){S.rm[i].on=!S.rm[i].on;render()}
function ntT(k){S.nt[k]=!S.nt[k];render()}
function rmSh(i){const r=S.rm[i],o=S.rm[1-i].h;sheet(`<h2 style="margin-top:0">${i?'Друге':'Перше'} нагадування</h2><p class="mu sm">За скільки годин до візиту нагадати?</p><div class="xts">${[...Array(24)].map((_,x)=>{const h=x+1;return `<button class="xo ${h==r.h?'on':''}" aria-pressed="${h==r.h}" ${h==o?'disabled':''} onclick="rmH(${i},${h})">${h} год</button>`}).join('')}</div><p class="sm mu" style="margin-bottom:0">Час іншого нагадування (${o} год) обрати не можна.</p>`)}
/* Перше нагадування завжди раніше за друге */
function rmH(i,h){S.rm[i].h=h;S.rm.sort((a,b)=>b.h-a.h);closeS();render()}
function rmIn(el){S.rmt=el.value;const a=nextAp(),p=$('#rmp');if(p&&a)p.textContent=rmTx(a);$('#rmn').textContent=el.value.length+' / 300';$('#rme').hidden=!!el.value.trim()}
function rmIns(i){const el=$('#rmt'),k=RMK[i][1],b=el.selectionStart,e=el.selectionEnd;if(el.value.length-(e-b)+k.length>300){toast('Текст задовгий');return}el.setRangeText(k,b,e,'end');el.focus();rmIn(el)}
function rmRs(){S.rmt=RMT0;render();toast('Повернуто стандартний текст')}
/* Демо-сповіщення майстрині: лише всередині застосунку. Повертає false, якщо цей тип вимкнено. */
function dnPush(k,x){if(!S.nt[k])return false;S.nq.push({id:Date.now()+Math.random(),t:NT.find(n=>n[0]==k)[1],x});if(S.mode=='master')dnShow();return true}
function dnShow(){clearTimeout(dnShow.t);$('#dn').innerHTML=S.nq.map(n=>`<div class="dni fx" role="status"><div><span class="chip done">Демо</span><b style="margin-top:4px">${esc(n.t)}</b><span class="sm mu">${esc(n.x)}</span></div><button class="xb" aria-label="Закрити сповіщення" onclick="dnX(${n.id})">✕</button></div>`).join('');if(S.nq.length)dnShow.t=setTimeout(()=>{S.nq=[];dnShow()},8000)}
function dnX(id){S.nq=S.nq.filter(n=>n.id!=id);dnShow()}
function reply(id,s){const a=S.appts.find(x=>x.id==id);if(!a)return;if(a.st==s){toast('Статус уже: '+ST[s]);return}if(!stOk(a,s)){toast('Ця дія недоступна для поточного статусу');return}if(a.st=='new')a.dec={r:s,t:Date.now()};a.st=s;a.seen=true;render();const x=`${a.name} · ${dl(a.o,a.time)}`;if(s=="canc"){if(!dnPush('cn',x))toast(esc(a.name)+" не зможе прийти");offer(a)}else if(!dnPush('ok',x))toast(esc(a.name)+" підтвердила візит")}
render();
(function(){const sp=document.getElementById('sp');if(!sp)return;const tb=sp.querySelector('.tb'),c=document.getElementById('spc'),x=c.getContext('2d'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,dp=Math.min(devicePixelRatio||1,2);let W,H,done=false,raf;
function rs(){W=innerWidth;H=innerHeight;c.width=W*dp;c.height=H*dp;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dp,0,0,dp,0,0)}rs();
const CL=['#ffffff','#ff7fae','#a98bf0'],st=[...Array(48)].map((_,i)=>({x:Math.random(),y:.5+(Math.random()-.5)*(Math.random()<.7?.26:.9),r:3+Math.random()*8,p:Math.random()*6.28,s:1.4+Math.random()*2.4,d:Math.random()*2200,c:CL[i%3]}));
function star(px,py,r,a,col){x.save();x.translate(px,py);x.globalAlpha=a;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=r*2.2;x.beginPath();for(let i=0;i<8;i++){const q=i%2?r*.22:r,an=i*Math.PI/4;x.lineTo(Math.cos(an)*q,Math.sin(an)*q)}x.closePath();x.fill();x.restore()}
const t0=performance.now();
function fr(t){const e=t-t0;x.clearRect(0,0,W,H);st.forEach(s=>{const k=Math.min(1,Math.max(0,(e-500-s.d)/700)),w=.5+.5*Math.sin(e/1000*s.s+s.p);if(k*w>.03)star(s.x*W,s.y*H,s.r*(.55+.45*w),k*w,s.c)});if(!done&&!rm)raf=requestAnimationFrame(fr)}
function fin(){if(done)return;done=true;cancelAnimationFrame(raf);sp.classList.add('out');setTimeout(()=>sp.remove(),800)}
addEventListener('resize',rs);sp.addEventListener('click',fin);
if(rm){fr(t0+3500)}else{requestAnimationFrame(fr)}
setTimeout(()=>tb.classList.add('go'),rm?0:400);setTimeout(fin,rm?2200:4400)})();
</script></body></html>
